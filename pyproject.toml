[build-system]
# >=77 for PEP 639: a bare `license` string is validated as an SPDX
# expression and emitted as License-Expression metadata. The old
# `{text = ...}` table produces a free-text License field instead, which
# no tool can check.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "semlayer"
version = "0.6.0b1"
description = "Semantic layer inference engine for data warehouses, with an openly licensed format"
readme = "README.md"
# SPDX: the registered identifier is FSL-1.1-ALv2, NOT the
# "FSL-1.1-Apache-2.0" spelling used as the licence's own abbreviation
# heading -- that is not on the SPDX list and PEP 639 validation rejects
# it. Deliberately no License:: classifier: FSL is not OSI-approved and
# claiming otherwise in machine-readable metadata would be false.
license = "FSL-1.1-ALv2"
license-files = ["LICENSE.md", "LICENSING.md", "spec/LICENSE",
                 "src/semlayer/spec/LICENSE", "src/semlayer/export/LICENSE"]
authors = [{name = "Neocatalyst Labs", email = "hello@semlayer.dev"}]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    # Upper bound deliberate: 2.0.0 changes floating-point aggregation in
    # the last bits -- avg(tot_amt) on messy_mart is 2037.53035625 on 1.5.x
    # and 2037.5303562499998 on 2.0.0. Query results are embedded in LLM
    # prompts, so that reaches cassette keys: it broke 9 tests on main with
    # prompts that had never been recorded. Our published numbers are pinned
    # to a duckdb build; moving major versions is a deliberate change with
    # re-recorded cassettes, not something pip picks up on a Tuesday.
    "duckdb>=1.5,<2",
    "anthropic>=0.40",
    "mcp>=1.0,<2",  # 2.x renamed FastMCP -> MCPServer and changed the tool API
    "sqlglot>=25",  # semantic SQL linter (MIT)
    # DuckDB returns a pytz tzinfo when it fetches a TIMESTAMPTZ value and does
    # not depend on pytz itself, so profiling any table with a timestamptz
    # column raises ModuleNotFoundError unless something else happened to pull
    # it in. Found when the dbt_synthea FK-floor test failed on a clean venv.
    "pytz>=2024.1",
]

[project.optional-dependencies]
warehouses = [
    "snowflake-connector-python>=3.12",
    "google-cloud-bigquery>=3.25",
    "psycopg[binary]>=3.2",
]
dev = [
    "pytest>=8.0",
    "python-dotenv>=1.0",
    # Upper-bounded deliberately: CI installed ruff unpinned, so a minor
    # release that ADDS a rule (0.16 added PLR0917) turned a green local
    # gate into a red CI run. Same failure mode as the mcp<2 pin.
    "ruff>=0.17,<0.18",
    "mypy>=2.0",
    "pip-audit>=2.10",
    # pgserver bundles a PostgreSQL binary, so tests/test_postgres.py is a real
    # integration test against a real server with no credentials and no Docker
    # -- unlike the Snowflake and BigQuery live tests, it runs in CI. It skips
    # if absent, so this is the only thing making that coverage happen.
    "pgserver>=0.1.4; sys_platform != 'win32'",
    "psycopg[binary]>=3.2",
]

[project.urls]
Homepage = "https://semlayer.dev"
Repository = "https://github.com/neocatalystlabs/semlayer"
Changelog = "https://github.com/neocatalystlabs/semlayer/blob/main/CHANGELOG.md"

[project.scripts]
semlayer = "semlayer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
semlayer = ["spec/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # Shells out to the full benchmark twice (~3.5 min). It guards the
    # reproducibility claim in docs/benchmark.md, which only a KEYLESS run
    # can check -- a maintainer with a key records the gaps and passes --
    # so it is slow by nature and still has to run in CI.
    "slow: minutes-long; runs in CI, deselect locally with -m 'not slow'",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle/pyflakes
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # bugbear
    "C90",              # mccabe complexity
    "PLR",              # pylint refactor (complexity/args/statements)
    "RUF",              # ruff-native
    "D",                # pydocstyle (public API why-docs)
    "T20",              # no stray print in library code
]
ignore = [
    "D203", "D213",     # docstring style conflicts (google convention)
    "D107", "D105",     # init/magic docstrings
    "PLR2004",          # magic-value comparisons (thresholds are documented constants)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 60
max-args = 7
max-branches = 14

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PLR", "T20", "E501"]
"fixtures/*" = ["D", "PLR", "T20", "E501", "C901"]
"src/semlayer/cli.py" = ["T20"]          # the CLI prints by design
"src/semlayer/benchmark.py" = ["T20"]
"examples/*" = ["T20"]                   # the examples print their report
# E501 inside a FROZEN prompt string (cassette-key bytes); cannot rewrap
"src/semlayer/describe/run.py" = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
