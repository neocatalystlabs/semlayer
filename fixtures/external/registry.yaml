# Real-world evaluation datasets. The repo ships the RECIPE, never the data.
#
# Every dataset listed here carries a permissive, explicit licence (or is a
# US-government work), verified by reading the licence itself. That is the bar
# for appearing in this file at all, and it is why `track: P` is on each entry:
# a number we publish has to be reproducible by whoever reads it, which means
# the dataset behind it has to be one they may obtain and use on the same terms
# we did.
#
# licence_verified is the date a human opened the actual licence file. It is not
# the date someone read a README, a blog post, or recalled the terms.
#
# A fetch script downloads into `data/`, which is gitignored. No dataset is
# redistributed here, and `docs/warehouses.md` is rendered from this file.

datasets:
  - name: adventureworks_dw
    version: "sql-server-samples@73c27309"   # by archive sha256, below
    track: P
    domain: manufacturing_sales_finance
    source: https://github.com/microsoft/sql-server-samples
    licence: MIT
    licence_url: https://github.com/microsoft/sql-server-samples/blob/master/license.txt
    licence_verified: 2026-10-09
    licence_notes: >
      MIT covers the sql-server-samples repository; the AdventureWorksDW
      install-script archive is published from that repo's release page.
    redistributable: true          # we still ship only the fetch script
    tables: 29
    columns: 349
    rows: 1047466
    features:
      # Role-playing is now FOUND, and this note used to say it was not.
      # Measured 2026-10-16: 36 of 40 declared single-column foreign keys are
      # emitted as relationships (recall 0.900), and ZERO of the four misses
      # are role-playing -- all four are self-referencing. Three of those four
      # ARE emitted, as `kind: recursive` hierarchies rather than
      # relationships, so a representation-aware score is 39/40 = 0.975. The
      # one genuinely dropped edge is DimDepartmentGroup: 7 rows, every child
      # pointing at the single root, so ParentDepartmentGroupKey has
      # n_distinct = 1 and the self-reference guard drops it.
      - role_playing_dimension     # FactInternetSales -> DimDate x3 (order/due/ship)
      - fiscal_calendar            # DimDate.FiscalYear / FiscalQuarter / FiscalSemester
      - recursive_hierarchy        # Account, DepartmentGroup, Employee, Organization
      - level_hierarchy            # ProductCategory 4 -> Subcategory 37 -> Product 606
      - pascal_case_naming         # the convention that exposed the typing blind spot
      - many_to_many_bridge        # FactInternetSalesReason; the corpus's only one
      - composite_foreign_key      # its FactInternetSales leg, 1 of 41 declared
    gold: vendor_declared
    gold_scope: >
      28 primary keys and 41 foreign keys, parsed from the vendor's own loader
      script into declared_keys.json and deliberately NOT applied to the
      database, so Link must discover them. Semantic types and descriptions are
      not asserted; nobody can be asked what this schema's unwritten rules are.
    fetch: fetch_adventureworks_dw.py
    sha256: 73c27309d17cd30bf5351665401106abf649d9f9a9ecb0c770682f6be965aba8
    notes: >
      No table exceeds 1M rows (largest is FactProductInventory at 776,286), so
      this does NOT exercise the sampling path. First acquisition; its PascalCase
      naming immediately exposed a typing bug worth more than the dataset.

  - name: cms_physician
    version: "2023 annual release, downloaded 2026-10-11"
    track: P
    domain: healthcare_billing
    source: https://data.cms.gov
    licence: US Government Works
    licence_url: https://www.usa.gov/government-works
    licence_verified: 2026-10-11
    licence_notes: >
      Read directly from data.cms.gov/data.json: all 6,615 distributions carry
      license=https://www.usa.gov/government-works. Dataset-level `license` is
      null; the per-distribution field is the authoritative one. Both files
      confirmed by title: "Medicare Physician & Other Practitioners - by
      Provider : 2023-12-31" and "- by Provider and Service : 2023-12-31".
    redistributable: true          # we still ship only the fetch script
    tables: 2
    columns: 109
    rows: 209                      # at --providers 30; scales with the sample
    features:
      - detail_plus_official_summary   # the reason this was acquired
      - suppression_rule               # lines under 11 beneficiaries omitted
      - domain_identifiers             # NPI, HCPCS: identifiers we do not recognise
      - pii_in_a_real_schema           # physicians' practice names and addresses
    gold: vendor_declared
    gold_scope: >
      CMS's own by-Provider totals are the answer key for reconciliation. No
      hand-authored gold: the engine cannot yet link these two tables, so there
      is nothing to score types against until that is fixed.
    fetch: fetch_cms_physician.py
    sha256: n/a                    # API-paged, not a fixed archive
    notes: >
      ACQUIRED TO TEST RULE RECOVERY ON A REAL WAREHOUSE, AND THE ENGINE FAILS.
      The reconciliation is real and verified by hand: 27 of 28 sampled
      providers have a summary total exceeding their detail sum, the gap is
      never negative, and min(Tot_Benes) in the detail is exactly 11 -- the
      documented suppression threshold is observable in the data. The engine
      recovers none of it, for two name-gating reasons recorded in
      docs/calibration.md. Sampling is by whole provider; an arbitrary row
      slice would make the gap an artefact of our own sampling.


  - name: dbt_synthea
    version: "33fdbfa"                        # pinned git commit
    track: P
    domain: clinical_research_omop
    source: https://github.com/OHDSI/dbt-synthea
    licence: Apache-2.0
    licence_url: https://github.com/OHDSI/dbt-synthea/blob/main/LICENSE
    licence_verified: 2026-10-12
    licence_notes: >
      Read the repository's own LICENSE file at pinned commit 33fdbfa: the
      standard Apache-2.0 text, "Licensed under the Apache License, Version
      2.0" at line 191. The appendix copyright line is the unfilled template
      "Copyright [yyyy] [name of copyright owner]", which is untidy but does
      not alter the grant. Attribution required; we ship only the fetch script.
    redistributable: true          # we still ship only the fetch script
    tables: 87                     # schema `main`; 29 more seed tables in other schemas
    columns: 995
    rows: 408455
    features:
      # THE REASON THIS WAS ACQUIRED: it is the first fixture that ships the
      # ETL which built it. target/manifest.json carries the compiled SQL and
      # the model DAG, which is the input the ETL-reading stage needs and
      # which no other dataset we hold has at all.
      - authoring_etl                 # dbt manifest: 87 models, compiled_code, DAG
      - declared_foreign_keys         # 235 deduped edges from relationships tests
      - conditional_foreign_keys      # 82 of them are relationships_where: an FK
                                      # that holds only under a filter. No fixture
                                      # we authored has this shape.
      - declared_column_types         # 421 expect_column_values_to_be_in_type_list
      - hub_and_spoke_fk              # 131 of 235 edges point at `concept`
      - intermediate_vs_published_pair # see notes: statistically identical tables
    gold: vendor_declared
    gold_scope: >
      235 deduped foreign-key edges parsed from the project's own
      `relationships` and `relationships_where` tests, plus 421 declared column
      types. Semantic types, descriptions and metrics are NOT asserted: OMOP
      CDM documents the structure, not this warehouse's unwritten rules.
    fetch: fetch_dbt_synthea.py
    sha256: n/a                    # pinned by git commit, which is stronger:
                                   # 33fdbfa9b354f00def5ee6e45525cb2da80e0ddf
    notes: >
      BASELINE MEASURED 2026-10-12, deterministic mode: FK recall 61/235 =
      26.0% (42/153 unconditional, 19/82 conditional), 249 relationships
      emitted, 116 tables, 2m43s.

      The 26% is NOT mostly missed joins -- it is the engine choosing a
      different parent from the one the humans declared, and the reason is
      worth the whole acquisition. `person` and `int__person` hold identical
      27-row person_id sets, both materialised as tables, and all 27 person_id
      edges were pointed at `int__person`. The manifest says `person` is built
      FROM `int__person`, so the published table is the one the gold declares.
      Statistics cannot separate the two; the DAG can. That is the clearest
      evidence we have that lineage reading is not a nice-to-have, and it was
      invisible until a fixture shipped its own ETL.
      Same pattern explains 0/12 to stg_synthea__encounters, 0/10 to provider,
      0/9 to visit_detail and 0/9 to visit_occurrence, against 93% to
      stg_synthea__patients where no competing intermediate exists.

      LIMITS: 27 patients, 604 visits, 59 conditions. It exercises ETL reading
      and is a poor test of statistical inference; cross-checking an
      ETL-derived claim against observed data is thin on 59 rows. Declared FKs
      are plentiful here because OMOP CDM is a PUBLISHED data model -- measured
      alongside it, Cal-ITP has 19 enabled across 624 models and Tuva Health 0
      across 353, so this validates the declared-constraint path and NOT the
      common enterprise case where joins must be parsed from SQL.

      Needs dbt-core and dbt-duckdb, which are not semlayer dependencies, plus
      one online `dbt deps`. Builds offline otherwise: PASS=1717 ERROR=0 in 93s.
      `dbt seed` MUST precede `dbt build`; the fetch script does this and says
      why.

  - name: gtfs_manteca
    purpose: >
      A real schema with no ETL stage convention and nothing to disambiguate,
      which is the combination the rest of the corpus lacks. Its identifiers
      are strings rather than dense integer surrogates, so a shared-key-set
      signal means what it says; its naming is snake_case, so key detection
      applies; it carries one copy of each entity; and `transfers` references
      `stops` twice, from `from_stop_id` and `to_stop_id`, for role-playing.
      Transit vocabulary, which no other dataset here supplies.
    licence: CC BY 4.0
    licence_url: https://www.manteca.gov/384/GTFS-Data
    licence_notes: >
      Stated verbatim on the publisher's page: "The City of Manteca's GTFS data
      is licensed under the CC BY 4.0 license." Direct download, no
      registration, no API key. MBTA was the first choice and was rejected: its
      feed is governed by a bespoke MassDOT Developers License Agreement PDF
      that a human must read before it could be recorded here.
    licence_verified: 2026-10-16
    track: P
    domain: public_transit
    features:
      - no_etl_convention        # 0 of 13 tables carry a stage prefix
      - string_identifiers       # route_id "0012" is not the integer 12
      - role_playing_dimension   # transfers.from_stop_id / to_stop_id -> stops
      - nothing_to_disambiguate  # one copy of each entity: the probe tier-2 case
    fetch: fixtures/external/fetch_gtfs_manteca.py
    sha256: cf4ba3eabc433f6bc52e1a0b18d682f894ee33823f94ab42e88f34acb9de0512
    source_url: https://s3.amazonaws.com/etatransit.gtfs/mantecatransit.etaspot.net/gtfs.zip

  - name: spider2
    purpose: >
      Roughly three hundred real schemas, and 376 gold SQL queries whose join
      predicates are foreign-key evidence on real naming. Every other dataset
      here is one warehouse; this is the only corpus large enough to say what
      real schemas look like rather than what one looks like. Measured across
      it: 2 of 314 databases carry any ETL stage prefix, so a stage convention
      is not something an inference engine can rely on finding.
    licence: MIT
    licence_url: https://github.com/xlang-ai/Spider2/blob/main/LICENSE
    licence_notes: >
      MIT, in the repository's own LICENSE file. The underlying warehouses are
      third-party (BigQuery public datasets, Snowflake Marketplace shares);
      MIT covers the schema extracts and gold SQL that this corpus ships, which
      is all we consume. We never fetch the warehouses themselves.
    licence_verified: 2026-10-16
    track: P
    domain: mixed                  # medicine, genomics, finance, sport, government
    fetch: fixtures/external/fetch_spider2.py
    source_url: https://github.com/xlang-ai/Spider2
    version: "cafb867313aab4e674652054198f383cf4018943"
    databases: 314           # 74 bigquery, 58+152 snowflake, 30 sqlite
    tables: 16115
    columns: 1054656         # top-level; 1,230,135 with nested RECORDs expanded
    gold: partial
    gold_provenance: derived     # extracted by us from the corpus's gold SQL
    gold_scope: >
      148 distinct foreign-key pairs over 48 databases, extracted from the gold
      SQL by resolving every qualifier through each query's own FROM/JOIN
      aliases and dropping CTE and subquery sides. RECALL ONLY: the queries
      cover the joins their questions needed, not every join each schema has,
      so a pair absent from the corpus is NOT a negative and no precision
      figure may be computed from it. Primary keys, semantic types,
      descriptions and metrics are not asserted.
    features:
      - no_etl_convention       # 2/314 databases carry any stage prefix
      - cross_name_foreign_keys # 74 of 148 FK pairs differ in column name
      - role_playing_dimension  # EU_soccer match.home/away_player_1..11 -> player
      - undocumented_schema     # 131/298 flat-schema dbs have ZERO descriptions
      - nested_record_schema    # 16/314 are BigQuery nested/REPEATED
    notes: >
      Ships three sample rows per table and no data, so inclusion testing
      cannot run and Link cannot be scored end-to-end here. What is measurable
      is every component that reads names only -- which is also what ranks the
      40 parents a child is tested against, so a true parent the names rank
      41st is never queried whatever the data would have said. Checkout is
      ~1.3 GB of schema JSON; the fetch is sparse and blobless for that reason.

