# Assertions WE authored about an acquired warehouse, kept apart from the
# vendor's own declared keys.
#
# `declared_keys.json` holds what Microsoft's loader script declares, and it
# lives under `data/`, which is gitignored and regenerated by the fetch script.
# Neither property suits an assertion of ours: it would be destroyed on the
# next fetch, and it would sit in a file whose whole contract is "the vendor
# said this, not us". So authored annotations live here, tracked, and labelled.
#
# What they are for: making a feature SCOREABLE. `fixtures/coverage_audit.py`
# separates "in the data", "asserted in gold" and "emitted by the engine". A
# shape that is in the data but in nobody's gold cannot be scored at all, so
# the engine's silence about it is indistinguishable from correctness.

dataset: adventureworks_dw
authored_by: us            # NOT vendor_declared -- cardinality is our reading
authored_on: 2026-10-16

relationships:
  # The corpus's only many-to-many, and the reason B2 did not need a synthetic
  # fixture. `FactInternetSalesReason` is a textbook bridge: three columns, all
  # three are key columns, the primary key is composite across all of them,
  # there are no measures, and it carries 64,515 rows over 53,969 distinct
  # order lines -- 1.195 reasons per line, so the relationship genuinely fans
  # out on both sides.
  - from: FactInternetSales
    to: DimSalesReason
    cardinality: many_to_many
    via: FactInternetSalesReason
    via_keys:
      # The bridge's two legs. The FactInternetSales leg is COMPOSITE, and it
      # is the only composite foreign key in all 41 the vendor declares.
      - columns: [SalesOrderNumber, SalesOrderLineNumber]
        references: FactInternetSales
      - columns: [SalesReasonKey]
        references: DimSalesReason
    evidence:
      bridge_rows: 64515
      distinct_left: 53969          # order lines
      distinct_right: 7             # sales reasons
      mean_right_per_left: 1.195
    notes: >
      Scoreable from today; NOT emittable yet, and blocked on two separate
      things rather than one. `link/run.py` hardcodes `"cardinality":
      "many_to_one"` at both emission sites, so the engine cannot say
      many_to_many about anything. And even once it can, recognising THIS
      bridge needs composite foreign-key discovery, which the engine does not
      attempt: the FactInternetSales leg is two columns. A detector that
      handles only the single-column leg would see half a bridge.
