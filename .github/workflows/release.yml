name: release

on:
  release:
    types: [published]
  workflow_dispatch: {}

# Our own CI does not send telemetry; see ci.yml for why.
env:
  SEMLAYER_TELEMETRY: "off"

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing (OIDC) — no tokens anywhere
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --quiet build
          python -m build
      - name: Smoke-test the wheel standalone
        run: |
          python -m venv /tmp/wt && /tmp/wt/bin/pip install --quiet dist/*.whl
          cd /tmp && /tmp/wt/bin/python -c "import semlayer, semlayer.validate"
          /tmp/wt/bin/semlayer --help > /dev/null
      - name: Benchmark replays reproduce at this release (BLOCKING)
        # docs/benchmark.md is "accurate as of release X". This is the one
        # place that claim is checked: the replay tests are skipped in
        # ordinary CI and run here, with no API key, against the committed
        # cassettes. If this step is red, the table on that page describes an
        # engine that is not the one being published, and the publish should
        # not proceed.
        #
        # It was continue-on-error at 0.7.0b1, deliberately and with the debt
        # written down: 8 Haiku answers and 76 Sonnet ones had stopped
        # replaying, and blocking would have held the MCP-first phase off PyPI
        # over a claim about the PREVIOUS release. That debt was paid at
        # 0.7.0b2 and the flag is gone, which was always the condition.
        #
        # Two things learned paying it, for whoever faces this next:
        #
        # 1. The estimate was wrong by more than 2x -- 190 stale answers, not
        #    84. `python -m semlayer.benchmark` aborts on the FIRST
        #    CassetteMiss, so it cannot tell you how many there are, and that
        #    count is the whole spend estimate. Count them keyless first,
        #    question by question, before paying for anything.
        #
        # 2. The cause was not a prompt-template edit. `semantic_context`
        #    renders from the INFERRED DOCUMENT, so engine work that changes
        #    the document changes the cassette key just as surely. messy_mart
        #    was invalidated in every semantic condition while fan_trap and
        #    tpcds_clean replayed clean, because messy_mart is the only
        #    fixture here with reconciled aggregates.
        #
        # And the standing trap, unchanged: `python -m semlayer.benchmark` is
        # Haiku-only. A re-record driven by the documented command refreshes
        # Haiku and silently leaves the published Sonnet row stale. Re-record
        # with an explicit answer_model for EVERY published row.
        env:
          SEMLAYER_RELEASE_CHECK: "1"
          ANTHROPIC_API_KEY: ""
        run: |
          python -m pip install --quiet -e ".[dev]"
          python fixtures/build.py
          python -m pytest tests/test_benchmark_replays.py -q
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
