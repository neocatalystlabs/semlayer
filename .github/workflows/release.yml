name: release

on:
  release:
    types: [published]
  workflow_dispatch: {}

# Our own CI does not send telemetry; see ci.yml for why.
env:
  SEMLAYER_TELEMETRY: "off"

jobs:
  vscode:
    # The VS Code extension, published with trusted publishing: an OIDC token
    # minted for this repo and this workflow, no PAT anywhere. Same reasoning
    # as the PyPI job below -- there is no long-lived secret to leak, rotate
    # or forget, and a policy on the marketplace side pins who may publish.
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - name: Types and tests
        run: |
          npm run typecheck
          npm test
      - name: Package
        run: npm run package
      - name: Publish to the VS Code Marketplace
        # --skip-duplicate so re-running a release does not fail on a version
        # that is already live; the marketplace refuses to replace one.
        run: >
          npx vsce publish --no-dependencies --azure-credential
          --packagePath semlayer-*.vsix --skip-duplicate
      - name: Publish to Open VSX (what Cursor reads)
        # Open VSX has no OIDC, so this one does need a token. It is skipped
        # rather than failed when the secret is absent, so the marketplace
        # publish above is not held hostage to it.
        if: ${{ secrets.OVSX_PAT != '' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish semlayer-*.vsix --pat "$OVSX_PAT"
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: extension/*.vsix

  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing (OIDC) — no tokens anywhere
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --quiet build
          python -m build
      - name: Smoke-test the wheel standalone
        run: |
          python -m venv /tmp/wt && /tmp/wt/bin/pip install --quiet dist/*.whl
          cd /tmp && /tmp/wt/bin/python -c "import semlayer, semlayer.validate"
          /tmp/wt/bin/semlayer --help > /dev/null
      - name: Benchmark replays reproduce at this release (BLOCKING)
        # docs/benchmark.md is "accurate as of release X". This is the one
        # place that claim is checked: the replay tests are skipped in
        # ordinary CI and run here, with no API key, against the committed
        # cassettes. If this step is red, the table on that page describes an
        # engine that is not the one being published, and the publish should
        # not proceed.
        #
        # It was continue-on-error at 0.7.0b1, deliberately and with the debt
        # written down: 8 Haiku answers and 76 Sonnet ones had stopped
        # replaying, and blocking would have held the MCP-first phase off PyPI
        # over a claim about the PREVIOUS release. That debt was paid at
        # 0.7.0b2 and the flag is gone, which was always the condition.
        #
        # Two things learned paying it, for whoever faces this next:
        #
        # 1. The estimate was wrong by more than 2x -- 190 stale answers, not
        #    84. `python -m semlayer.benchmark` aborts on the FIRST
        #    CassetteMiss, so it cannot tell you how many there are, and that
        #    count is the whole spend estimate. Count them keyless first,
        #    question by question, before paying for anything.
        #
        # 2. The cause was not a prompt-template edit. `semantic_context`
        #    renders from the INFERRED DOCUMENT, so engine work that changes
        #    the document changes the cassette key just as surely. messy_mart
        #    was invalidated in every semantic condition while fan_trap and
        #    tpcds_clean replayed clean, because messy_mart is the only
        #    fixture here with reconciled aggregates.
        #
        # And the standing trap, unchanged: `python -m semlayer.benchmark` is
        # Haiku-only. A re-record driven by the documented command refreshes
        # Haiku and silently leaves the published Sonnet row stale. Re-record
        # with an explicit answer_model for EVERY published row.
        env:
          SEMLAYER_RELEASE_CHECK: "1"
          ANTHROPIC_API_KEY: ""
        run: |
          python -m pip install --quiet -e ".[dev]"
          python fixtures/build.py
          python -m pytest tests/test_benchmark_replays.py -q
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Register the release with the official MCP Registry
        # AFTER the PyPI publish, and it has to be: the registry validates
        # that `packages[].identifier` at `packages[].version` actually
        # exists on PyPI, and that the published description carries the
        # `mcp-name: <server name>` marker. Both are only true once the
        # upload above has succeeded.
        #
        # A red here means PyPI SHIPPED and the registry did not -- the
        # release is out, the listing is stale. That is deliberately loud
        # rather than continue-on-error, which is how the benchmark gate
        # rotted for two releases. Fix by re-running this job; see the
        # duplicate handling below for why that is safe.
        #
        # Versions are written from pyproject rather than from the tag: the
        # tag is `v0.7.0-beta.2` and the package is `0.7.0b2`, and those two
        # spellings have to agree with PyPI, not with each other. Patching
        # both fields here means the committed server.json cannot drift from
        # the release.
        #
        # Registry versions are IMMUTABLE. Re-running a successful release
        # therefore fails with "duplicate version", which is success for our
        # purposes -- the listing already describes this release -- so that
        # one error is swallowed and everything else fails the job.
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          VERSION="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          python - "$VERSION" <<'PY'
          import json, pathlib, sys
          v = sys.argv[1]
          p = pathlib.Path("server.json"); d = json.loads(p.read_text())
          d["version"] = v
          for pkg in d["packages"]:
              pkg["version"] = v
          p.write_text(json.dumps(d, indent=2) + "\n")
          print(f"server.json pinned to {v}")
          PY
          curl -sSL -o publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.7/mcp-publisher_linux_amd64.tar.gz
          tar xzf publisher.tar.gz mcp-publisher
          ./mcp-publisher login dns --domain semlayer.dev --private-key "$MCP_PRIVATE_KEY"
          set +e
          out="$(./mcp-publisher publish --file server.json 2>&1)"; rc=$?
          set -e
          echo "$out"
          if [ $rc -ne 0 ]; then
            echo "$out" | grep -q "duplicate version" || exit $rc
            echo "already registered at this version -- nothing to do"
          fi
