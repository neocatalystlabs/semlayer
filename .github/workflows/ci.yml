name: CI

on:
  pull_request:
  push:
    branches: [main]

# Our own CI does not send telemetry. Every job was a fresh machine to the
# spool, so each run arrived as a brand new install and inflated the only
# number telemetry exists to produce. The receiver cannot filter this for
# us: a `ci` flag from a user's pipeline looks exactly the same, and that
# is a signal worth keeping.
#
# Set here rather than per job so a new job inherits it. Tests that need
# telemetry ON clear the variable themselves, which is why this does not
# hollow out the telemetry suite -- verified by running it with the switch
# set.
env:
  SEMLAYER_TELEMETRY: "off"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # No bare `ruff mypy` here: both are in the dev extra with version
      # bounds, and installing them unpinned alongside it resolved to the
      # latest release -- so a minor version that added a lint rule failed
      # CI against a green local gate.
      - run: pip install -e ".[dev]"
      - name: Lint (zero findings)
        run: ruff check src/
      - name: Types (zero errors)
        run: mypy
      - name: Build fixtures
        run: python fixtures/build.py
      - name: Tests + eval floors (cassette replay, $0 LLM)
        # No API key in this job BY DESIGN: a cassette miss fails loudly
        # instead of silently spending money or producing unpinned outputs.
        run: pytest tests/ -q --ignore=tests/test_snowflake_live.py --ignore=tests/test_bigquery_live.py

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[warehouses]" pip-audit
      - name: Dependency CVE audit
        run: pip-audit
