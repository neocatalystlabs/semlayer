name: CI

on:
  pull_request:
  push:
    branches: [main]

# Our own CI does not send telemetry. Every job was a fresh machine to the
# spool, so each run arrived as a brand new install and inflated the only
# number telemetry exists to produce. The receiver cannot filter this for
# us: a `ci` flag from a user's pipeline looks exactly the same, and that
# is a signal worth keeping.
#
# Set here rather than per job so a new job inherits it. Tests that need
# telemetry ON clear the variable themselves, which is why this does not
# hollow out the telemetry suite -- verified by running it with the switch
# set.
env:
  SEMLAYER_TELEMETRY: "off"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # No bare `ruff mypy` here: both are in the dev extra with version
      # bounds, and installing them unpinned alongside it resolved to the
      # latest release -- so a minor version that added a lint rule failed
      # CI against a green local gate.
      - run: pip install -e ".[dev]"
      - name: Lint (zero findings)
        run: ruff check src/
      - name: Types (zero errors)
        run: mypy
      - name: Build fixtures
        run: python fixtures/build.py
      - name: Tests + eval floors (cassette replay, $0 LLM)
        # No API key in this job BY DESIGN: a cassette miss fails loudly
        # instead of silently spending money or producing unpinned outputs.
        #
        # `-n auto` is CI-only and the distinction matters. On the 8GB dev box
        # xdist makes the suite SLOWER -- workers page instead of
        # parallelising, and `-n 8` once drove load average to 21. A
        # GitHub-hosted runner is 4 vCPU and 16GB with an SSD, where the
        # reason that fails does not apply. 1,003 tests ran serially in ~6
        # minutes and that was the whole of this job's wall clock; setup,
        # lint, types and fixtures together are under 40 seconds.
        #
        # Safe to parallelise because conftest gives every test its own
        # SEMLAYER_HOME under tmp_path and chdirs into a per-test directory,
        # so there is no shared mutable state; `fixtures/build` is read-only
        # by the time pytest starts, built by the step above.
        #
        # `--durations=15` stays on deliberately: if this job creeps back up,
        # the next run says where the time went instead of needing a bisect.
        run: pytest tests/ -q -n auto --durations=15 --ignore=tests/test_snowflake_live.py --ignore=tests/test_bigquery_live.py

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[warehouses]" pip-audit
      - name: Dependency CVE audit
        run: pip-audit
