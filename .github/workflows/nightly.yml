name: Nightly (live)

# Live tier: real warehouse connectors + live LLM sanity. Requires repo
# secrets (GOOGLE_*, ANTHROPIC_API_KEY); jobs skip cleanly when absent so
# forks stay green.
#
# Snowflake live tier disabled 2026-09-08: the trial account backing
# SNOWFLAKE_* secrets expired (trial ended, warehouses suspended), so the
# reader fixture in test_snowflake_live.py hard-fails at connect time
# instead of skipping. Re-enable by adding test_snowflake_live.py back to
# the pytest line below once a live Snowflake account is provisioned.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'neocatalystlabs'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,warehouses]"
      - name: Live warehouse tier (skips without secrets)
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pytest tests/test_bigquery_live.py -q
